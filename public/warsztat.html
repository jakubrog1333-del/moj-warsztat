<script>(()=>{'use strict';
const KEY='moj-warsztat-bez-logowania-v1';
const DEFAULT_PARTS=[
 {sku:'FIL-120',name:'Filtr oleju',supplier:'Inter Cars',price:38,stock:6},
 {sku:'OL-5W30',name:'Olej 5W30 5 l',supplier:'Inter Cars',price:145,stock:4},
 {sku:'KLO-401',name:'Klocki hamulcowe przód',supplier:'Auto Partner',price:198,stock:2},
 {sku:'TRC-218',name:'Tarcza hamulcowa',supplier:'Inter Parts',price:170,stock:0},
 {sku:'FIL-222',name:'Filtr kabinowy',supplier:'Auto Partner',price:48,stock:8},
 {sku:'AKU-70',name:'Akumulator 70 Ah',supplier:'Inter Parts',price:410,stock:1}
];
const $=sel=>document.querySelector(sel);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=prefix=>prefix+'-'+(crypto.randomUUID?.()||Math.random().toString(36).slice(2,10)).slice(0,12);
const ds=shift=>{const d=new Date();d.setDate(d.getDate()+(shift||0));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const localDate=d=>{d=new Date(d);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const datePl=s=>s?new Date(String(s).slice(0,10)+'T12:00:00').toLocaleDateString('pl-PL'):'—';
const money=x=>Number(x||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const normalReg=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const validVIN=s=>!s||/^[A-HJ-NPR-Z0-9]{17}$/.test(s);
const done=o=>o?.status==='Zakończone'||o?.status==='Anulowane';
const order=id=>db.orders.find(o=>o.id===id);
const gross=o=>Number(o?.finalAmount||0);
const car=o=>[o?.brand,o?.model].filter(Boolean).join(' ')+(o?.registration?' • '+o.registration:'');

const btn=(name,action,cls='',id='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${id?`data-id="${esc(id)}"`:''}>${name}</button>`;

const area=(label,name,value='',placeholder='')=>`<label class="full"><span class="field-label">${esc(label)}</span><textarea name="${esc(name)}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></label>`;

function defaults(){return {schemaVersion:3,settings:{name:'Mój Warsztat',sender:'Mój Warsztat'},orders:[],calendarEvents:[],sms:[],purchases:[],parts:structuredClone(DEFAULT_PARTS)}}
function migrated(raw){
 let src=raw&&typeof raw==='object'?raw:defaults();
 const oldClients=Array.isArray(src.clients)?src.clients:[],oldVehicles=Array.isArray(src.vehicles)?src.vehicles:[];
 const cMap=new Map(oldClients.map(c=>[c.id,c])),vMap=new Map(oldVehicles.map(v=>[v.id,v]));
 let out=defaults();
 out.settings={...out.settings,...(src.settings||{})};
 out.parts=Array.isArray(src.parts)?src.parts:out.parts;
 out.purchases=Array.isArray(src.purchases)?src.purchases:[];
 out.orders=(Array.isArray(src.orders)?src.orders:[]).map(o=>{
    const v=vMap.get(o.vehicleId)||{},c=cMap.get(v.clientId)||{};
    return {...o,clientName:o.clientName||c.name||'',phone:o.phone||c.phone||'',email:o.email||c.email||'',brand:o.brand||v.brand||'',model:o.model||v.model||'',registration:o.registration||v.registration||'',vin:o.vin||v.vin||'',mileage:o.mileage||v.mileage||'',workDone:o.workDone||'',discoveries:o.discoveries||'',finalAmount:o.finalAmount??null,completedAt:o.completedAt||((o.status==='Zakończone'||o.status==='Anulowane')?(o.deadline||o.date||ds()):'')};
 });
 out.calendarEvents=(Array.isArray(src.calendarEvents)?src.calendarEvents:[]).map(e=>{
    let o=out.orders.find(x=>x.id===e.orderId),c=cMap.get(e.clientId);

 case 'photo-new':openPhoto();break;
 case 'photo-for-order':openPhoto(id);break;
 case 'photo-delete':if(confirm('Trwale usunąć to zdjęcie z tego urządzenia?')){await deletePhoto(id);refreshGallery();toast('Usunięto zdjęcie.')}break;
 case 'sms-new':openSms();break;
 case 'sms-for-order':openSms(id);break;
 case 'sms-send':{let x=db.sms.find(x=>x.id===id);if(x)smsUri(x);break}
 case 'vin-check':foundVIN(($('#vinManual')?.value||'').toUpperCase().replace(/[^A-Z0-9]/g,''));break;
 case 'vin-scan':await startScanner();break;
 case 'vin-file':$('#vinFile')?.click();break;
 case 'purchase-add':{let p=db.parts.find(x=>x.sku===id);if(!p)break;let r=db.purchases.find(x=>x.sku===id);if(r)r.qty++;else db.purchases.push({id:uid('Q'),sku:p.sku,name:p.name,supplier:p.supplier,qty:1,date:ds()});save();draw();toast('Dodano część do zapytania.');break}
 case 'purchase-remove':db.purchases=db.purchases.filter(x=>x.id!==id);save();draw();break;
 case 'purchases-csv':if(db.purchases.length)download('zapytanie-czesci-'+ds()+'.csv',csv(db.purchases),'text/csv;charset=utf-8');else toast('Lista zapytań jest pusta.');break;
 case 'backup-download':await exportBackup();break;
 case 'backup-import':$('#backupFile')?.click();break;
 case 'reset':if(confirm('USUNĄĆ WSZYSTKIE ZLECENIA, ARCHIWUM, KALENDARZ, SMS I ZDJĘCIA? Tej operacji nie da się cofnąć.')){db=defaults();save();await clearPhotos();close();changePage('dashboard');toast('Dane zostały wyczyszczone.')}break;
 }}catch(e){toast('Wystąpił problem: '+e.message)}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.matches('[name=registration]'))t.value=t.value.toUpperCase();
 if(t.matches('[name=vin]'))t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,17);
 if(t.id==='vinManual')t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,17);
 if(t.id==='smsText'&&$('#smsCount'))$('#smsCount').textContent=t.value.length;
 if(t.matches('[data-live]')){const key=t.dataset.live;ui[key]=t.value;let cursor=t.selectionStart;draw();let next=document.querySelector(`[data-live="${key}"]`);if(next){next.focus();try{next.setSelectionRange(cursor,cursor)}catch{}}}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.matches('[data-change]')){ui[t.dataset.change]=t.value;draw()}
 if(t.id==='smsTemplate'||t.id==='smsOrder')fillSms();
 if(t.id==='vinFile'&&t.files?.[0])detectPhotoVIN(t.files[0]);
 if(t.id==='backupFile'&&t.files?.[0])restoreBackup(t.files[0]);
 if(t.id==='calOrderId'&&t.value){let o=order(t.value),f=t.closest('form');if(o&&f){for(const key of ['clientName','phone','brand','model','registration','vin'])if(f.elements[key])f.elements[key].value=o[key]||''}}
});
document.addEventListener('submit',async ev=>{
 const f=ev.target;if(!['orderForm','calendarForm','photoForm','smsForm','settingsForm'].includes(f.id))return;ev.preventDefault();
 const data=Object.fromEntries(new FormData(f).entries());
 try{
 if(f.id==='orderForm'){
   let existing=f.dataset.id?order(f.dataset.id):null,val=normalizeOrderData(data,existing);
   if(!val.clientName||!val.phone||!val.brand||!val.model||!val.registration||!val.issue){toast('Uzupełnij klienta, telefon, pojazd, rejestrację i zakres prac.');return}
   let before=existing?{...existing}:null;
   if(existing)Object.assign(existing,val);else db.orders.push(val);
   if(!save()){if(existing)Object.assign(existing,before);else db.orders.pop();return}
   let imgs=filesFromForm(f),count=imgs.length?await storeImages(val.id,imgs,'Przy przyjęciu',data.photoNote||''):0;
   close();changePage('orders');toast('Zapisano zlecenie '+val.id+(count?' i '+count+' zdjęć.':'.'));
 }
 else if(f.id==='calendarForm'){
   let start=new Date(data.start),end=new Date(data.end);
   if(!Number.isFinite(+start)||!Number.isFinite(+end)||end<=start){toast('Podaj prawidłowy początek i koniec terminu.');return}
   if(!data.clientName?.trim()||!data.phone?.trim()||!data.brand?.trim()||!data.model?.trim()){toast('Wypełnij dane klienta, telefon, markę i model.');return}
   let vin=String(data.vin||'').toUpperCase().replace(/\s/g,'');if(!validVIN(vin)){toast('VIN musi mieć 17 znaków.');return}
   const existing=db.calendarEvents.find(e=>e.id===f.dataset.id);let linked=data.orderId?order(data.orderId):null;
   if(data.orderId&&!linked){toast('Nie znaleziono powiązanego zlecenia.');return}
   const fields={clientName:data.clientName.trim(),phone:data.phone.trim(),brand:data.brand.trim(),model:data.model.trim(),registration:normalReg(data.registration),vin};
   if(linked){Object.assign(linked,fields);if(!linked.deadline&&data.type==='Odbiór')linked.deadline=data.start.slice(0,10)}
   else if(!existing?.orderId){linked={id:newOrderId(),...fields,email:'',mileage:0,issue:(data.note||'Wizyta w warsztacie').trim(),date:data.start.slice(0,10),deadline:data.type==='Odbiór'?data.start.slice(0,10):'',status:'Oczekuje',labor:0,parts:0,workDone:'',discoveries:'',notes:'',finalAmount:null,completedAt:'',createdAt:new Date().toISOString()};db.orders.push(linked)}
   else {linked=order(existing.orderId);if(linked)Object.assign(linked,fields)}
   const entry={id:existing?.id||uid('T'),orderId:linked?.id||'',...fields,title:[fields.clientName,fields.brand,fields.model].filter(Boolean).join(' · '),type:data.type||'Wizyta',start:data.start,end:data.end,note:(data.note||'').trim()};
   if(existing)Object.assign(existing,entry);else db.calendarEvents.push(entry);
   if(!save()){toast('Nie udało się zapisać terminu.');return}
   const photos=linked?filesFromForm(f):[];const savedPhotos=photos.length?await storeImages(linked.id,photos,'Przy przyjęciu',data.photoNote||''):0;
   ui.selectedDay=data.start.slice(0,10);ui.calMonth=ui.selectedDay.slice(0,7);close();changePage('calendar');toast('Zapisano zlecenie i termin'+(savedPhotos?' oraz '+savedPhotos+' zdjęć.':'.'));
 }
 else if(f.id==='photoForm'){
   if(!order(data.orderId)){toast('Wybierz zlecenie.');return}
   let images=filesFromForm(f);if(!images.length){toast('Wybierz co najmniej jedno zdjęcie.');return}
   let count=await storeImages(data.orderId,images,data.category||'Uszkodzenie',data.note||'');close();changePage('photos');toast('Zapisano '+count+' zdjęć do '+data.orderId+'.');
 }
 else if(f.id==='smsForm'){
   let o=order(data.orderId),text=(data.text||'').trim(),type=$('#smsTemplate')?.value;
   if(!o?.phone){toast('Zlecenie nie ma telefonu.');return}
   if(!text){toast('Wpisz treść wiadomości.');return}
   if(['Wycena końcowa brutto','Naprawa zakończona + koszt'].includes(type)&&gross(o)<=0){toast('Najpierw wpisz końcowy koszt brutto w zleceniu.');return}
   let s={id:uid('S'),orderId:o.id,clientName:o.clientName,phone:o.phone,template:type,text,date:ds()};db.sms.push(s);if(!save())return;close();changePage('sms');smsUri(s);
 }
 else if(f.id==='settingsForm'){db.settings={name:(data.name||'').trim(),sender:(data.sender||'').trim()};if(save()){draw();toast('Zapisano ustawienia.')}}
 }catch(e){toast('Nie udało się zapisać: '+e.message)}
});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
// Stara PWA może pokazywać wcześniejszą wersję z pamięci. Nie rejestrujemy nowego service workera.
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rows=>rows.filter(r=>r.scope.includes('/moj-warsztat/')).forEach(r=>r.unregister())).catch(()=>{});
draw();
})();

</script></body></html>
