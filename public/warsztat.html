<script>(()=>{'use strict';
const KEY='moj-warsztat-bez-logowania-v1';
const DEFAULT_PARTS=[
 {sku:'FIL-120',name:'Filtr oleju',supplier:'Inter Cars',price:38,stock:6},
 {sku:'OL-5W30',name:'Olej 5W30 5 l',supplier:'Inter Cars',price:145,stock:4},
 {sku:'KLO-401',name:'Klocki hamulcowe przód',supplier:'Auto Partner',price:198,stock:2},
 {sku:'TRC-218',name:'Tarcza hamulcowa',supplier:'Inter Parts',price:170,stock:0},
 {sku:'FIL-222',name:'Filtr kabinowy',supplier:'Auto Partner',price:48,stock:8},
 {sku:'AKU-70',name:'Akumulator 70 Ah',supplier:'Inter Parts',price:410,stock:1}
];
const $=sel=>document.querySelector(sel);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=prefix=>prefix+'-'+(crypto.randomUUID?.()||Math.random().toString(36).slice(2,10)).slice(0,12);
const ds=shift=>{const d=new Date();d.setDate(d.getDate()+(shift||0));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const localDate=d=>{d=new Date(d);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const datePl=s=>s?new Date(String(s).slice(0,10)+'T12:00:00').toLocaleDateString('pl-PL'):'—';
const nextHour=()=>{const d=new Date();d.setHours(d.getHours()+1,0,0,0);return localDate(d)};
const addHour=start=>localDate(new Date(new Date(start).getTime()+3600000));
// Skrót wyświetlany w kalendarzu: model + najwyżej 4 słowa o pracy (łącznie maks. 5).
// Domyślnie lokalne rozpoznawanie rodzaju usługi; gdy przeglądarka ma gotowy model AI na urządzeniu,
// opcjonalne ulepszenie zostanie wykonane w tle. Dane zleceń nie trafiają do zewnętrznego API.
function shortServiceText(description,limit=4){
 const text=String(description||'').toLocaleLowerCase('pl-PL');
 const categories=[
  [/olej|filtr|smarowan/, 'Wymiana oleju i filtrów'],
  [/zawiesz|wahacz|amortyz|sprężyn|luz[yó]?|sworz|tulej/, 'Naprawa i kontrola zawieszenia'],
  [/diagnost|komputer|błęd|blad|check.engine|kontrolk/, 'Diagnostyka komputerowa'],
  [/hamul|klock|tarcz|zacisk|abs/, 'Serwis układu hamulcowego'],
  [/klimatyz|klima|chłodzen|chlodzen/, 'Serwis klimatyzacji'],
  [/rozrząd|rozrzad|pasek.roz|łańcuch.roz/, 'Wymiana rozrządu'],
  [/opon|koł|kol|felg|geometri/, 'Serwis kół i opon'],
  [/akumulator|alternator|rozrusznik|elektryk|ładowani/, 'Kontrola instalacji elektrycznej'],
  [/sprzęg|sprzeg|skrzyni|biegów|biegow/, 'Naprawa układu napędowego'],
  [/wydech|tłumik|tlumik|dpf|egr/, 'Naprawa układu wydechowego'],
  [/silnik|głowic|glowic|uszczelk/, 'Diagnostyka i naprawa silnika'],
  [/przegląd|przeglad|kontrol|serwis/, 'Przegląd techniczny'],
 ];
 let hit=categories.find(([re])=>re.test(text));
 let clean=hit?hit[1]:String(description||'').replace(/[^\p{L}\p{N}\s-]/gu,' ').replace(/\s+/g,' ').trim();
 const words=clean.split(/\s+/).filter(Boolean);
 return (words.length?words:['Do','ustalenia']).slice(0,Math.max(1,limit)).join(' ');
}
function scheduleSummary(o){
 let model=String(o?.model||'Pojazd').trim().split(/\s+/).filter(Boolean).slice(0,3);
 const service=shortServiceText(o?.issue||'',Math.max(1,5-model.length));
 return [...model,service].join(' · ');

const photoDB=()=>new Promise((resolve,reject)=>{const req=indexedDB.open('moj-warsztat-bez-logowania-photos-v1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function photoTransaction(mode,cmd){const d=await photoDB();return new Promise((resolve,reject)=>{let t=d.transaction('photos',mode);let result;try{result=cmd(t.objectStore('photos'));}catch(err){d.close();reject(err);return}t.oncomplete=()=>{d.close();resolve(result?.result)};t.onerror=()=>{d.close();reject(t.error)}})}

function blobToDataUrl(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function compress(file){if(file.size>22*1024*1024)throw Error('Zdjęcie przekracza 22 MB.');if(!file.type.startsWith('image/'))throw Error('To nie jest zdjęcie.');const load=()=>new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);resolve(i)};i.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Nie mogę odczytać obrazu'))};i.src=u});let img=await load(),ratio=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Nie można przetworzyć zdjęcia')),'image/jpeg',.78))}

async function openCamera(mode){
 const panel=$('#cameraPanel');if(!panel)return;
 endCamera();
 if(!navigator.mediaDevices?.getUserMedia){toast('Przeglądarka nie obsługuje aparatu w tej aplikacji. Użyj opcji systemowej.');return}
 if(!window.isSecureContext){toast('Aparat wymaga bezpiecznego adresu HTTPS.');return}
 if(mode==='video'&&typeof MediaRecorder==='undefined'){toast('Nagrywanie wideo w tym trybie nie jest obsługiwane. Użyj aparatu systemowego.');return}
 panel.hidden=false;panel.innerHTML='<div class="tiny" style="color:white">Uruchamiam aparat…</div>';
 try{
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:mode==='video'})}
  catch(e){if(mode!=='video')throw e;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});toast('Aparat działa bez mikrofonu. Włącz zgodę na mikrofon, aby nagrywać dźwięk.')}
  if(!panel.isConnected){stream.getTracks().forEach(t=>t.stop());return}
  ui.cameraStream=stream;ui.cameraMode=mode;
  panel.innerHTML=`<div class="field-label" style="color:white">${mode==='photo'?'Zrób zdjęcie':'Nagraj film — maks. 90 s'}</div><video id="cameraLive" autoplay muted playsinline webkit-playsinline></video><div class="actions">${mode==='photo'?btn('📸 Zrób zdjęcie','camera-shot'):btn('🔴 Rozpocznij nagrywanie','camera-record-start')}${btn('Anuluj','camera-cancel','ghost')}</div><div id="cameraState" class="tiny" style="color:white;margin-top:8px"></div>`;
  const video=$('#cameraLive');video.srcObject=stream;
  try{await video.play()}catch{toast('Dotknij podglądu aparatu, żeby go uruchomić.')} 
 }catch(e){endCamera();toast('Nie udało się uruchomić aparatu ('+(e.name||'błąd')+'). Sprawdź uprawnienia aparatu lub użyj opcji systemowej.')}
}
function captureCameraPhoto(){
 const v=$('#cameraLive');if(!v||!ui.cameraStream||!v.videoWidth){toast('Aparat jeszcze nie pokazuje obrazu. Spróbuj ponownie.');return}
 const canvas=document.createElement('canvas');const scale=Math.min(1,1800/Math.max(v.videoWidth,v.videoHeight));canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);
 canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
 canvas.toBlob(blob=>{if(blob)queueCameraFile(new File([blob],`zdjecie-${Date.now()}.jpg`,{type:'image/jpeg'}));else toast('Nie udało się utworzyć zdjęcia.')},'image/jpeg',.85);
 endCamera();
}
function startCameraRecording(){

  const types=['video/mp4','video/webm;codecs=vp8,opus','video/webm'];const mimeType=types.find(t=>MediaRecorder.isTypeSupported?.(t))||'';

   let s={id:uid('S'),orderId:o.id,clientName:o.clientName,phone:o.phone,template:type,text,date:ds()};db.sms.push(s);if(!save())return;close();changePage('sms');smsUri(s);
 }
 else if(f.id==='settingsForm'){db.settings={name:(data.name||'').trim(),sender:(data.sender||'').trim()};if(save()){draw();toast('Zapisano ustawienia.')}}
 }catch(e){toast('Nie udało się zapisać: '+e.message)}
