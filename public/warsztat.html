<style>
:root{--ink:#182c3c;--muted:#71808c;--surface:#fff;--bg:#f3f5f6;--line:#e4e9ec;--accent:#0d917e;--accent-lt:#e4f6f0;--yellow:#f8b84b;--red:#d96357;--sidebar:#152633;--shadow:0 8px 35px rgba(21,38,51,.06)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84dfcc;outline-offset:2px}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:var(--sidebar);padding:25px 17px;color:#d9e6ec;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;margin:6px 10px 34px}.brand-mark{background:#f4bb59;border-radius:13px;padding:8px;color:#132735;font-size:24px;font-weight:800;line-height:1}.brand strong{display:block;font-size:18px;line-height:1.15;letter-spacing:-.4px;color:#fff}.brand small{color:#92aab8}.nav-title{text-transform:uppercase;letter-spacing:1.5px;color:#6c8595;font-size:10px;font-weight:800;margin:21px 12px 8px}.nav-btn{border:0;width:100%;border-radius:10px;background:transparent;color:#b7c9d2;text-align:left;padding:12px;display:flex;align-items:center;gap:12px;margin:1px 0;font-weight:600}.nav-btn:hover,.nav-btn.active{color:white;background:#264352}.nav-btn.active{box-shadow:inset 3px 0 #29b499}.nav-icon{width:21px;text-align:center;font-size:18px}.side-bottom{margin-top:auto;background:#233a49;border-radius:12px;padding:14px;font-size:12px;color:#b9cbd6}.side-bottom b{display:block;color:#fff;font-size:13px}.main{min-width:0}.top{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 36px}.crumb{font-weight:800;font-size:19px;lette -radius:10px;background:#e6f6f2;padding:7px 10px;font-size:18px}.metric .label{color:#6c7b86;font-size:12px;font-weight:700}.duo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow);margin-bottom:17px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.panel-head h2{margin:0;font-size:17px;letter-spacing:-.3px}.subtle{color:var(--muted)}.empty{padding:45px 12px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;white-space:nowrap}.data-table th{text-transform:uppercase;letter-spacing:.7px;color:#8a97a0;font-size:10px;text-align:left;font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line)}.data-table td{padding:14px 12px;border-bottom:1px solid #edf0f1;font-size:12px}.data-table tr:last-child td{border-bottom:0}.data-table tr:hover td{background:#fafcfc}.table-title{font-weight:800;color:var(--ink);font-size:13px}.tiny{font-size:11px;color:var(--muted)}.searchbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.searchbar input{flex:1;min-width:160px}.field,input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce5e7;border-radius:9px;background:white;color:var(--ink);min-height:42px}textarea{min-height:100px;resize:vertical}.field-label{font-weight:750;font-size:12px;margin:0 0 6px;display:block;color:#536573}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}.note{padding:12px 15px;border-radius:10px;background:#f0f7f7;border:1px solid #d7ebea;color:#46636c;font-size:12px;margin:13px 0}.note.warn{background:#fff8eb;border-color:#f5e6c8;color:#8a692c}.note.danger{background:#fff0ef;border-color:#f5d4ce;color:#914c48}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:12px;padding:11px 9px;border-bottom:1px solid #eff1f2}.step .num{width:28px;height:28px;background:#e7f6f2;color:#088771;border-radius:50%;display:grid;place-items:center;font-weight:900}.bars{display:flex;align-items:end;gap:10px;height:150px;padding:10px 0}.bar-wrap{flex:1;text-align:center;color:#93a1a9;font-size:11px}.bar{background:linear-gradient(0deg,#0d917e,#7ddbc6);border-radius:6px 6px 0 0;min-height:4px;width:100%;display:block}.bar-wrap span{display:block;margin-top:6px}.listcard{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #edf0f1}.listcard:last-child{border-bottom:0}.listcard b{font-size:13px}.listcard p{margin:3px 0 0;color:var(--muted);font-size:12px}.supplier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.supplier{border:1px solid var(--line);border-radius:13px;padding:17px;background:#fff}.supplier .sup-brand{height:44px;display:flex;align-items:center;font-size:19px;font-weight:900;letter-spacing:-.6px}.supplier p{font-size:12px;color:var(--muted);min-height:52px}.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.photo img{width:100%;height:126px;object-fit:cover;display:block}.photo .meta{padding:9px;font-size:12px}.photo .meta b{display:block;overflow-wrap:anywhere}.tag{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#85959d;font-weight:900}.modal-overlay{position:fixed;inset:0;background:rgba(12,30,40,.58);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.modal{background:#fff;max-width:660px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 24px 100px #071d2d77}.modal h2{font-size:23px;letter-spacing:-.7px;margin:0 0 6px}.modal-header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.x{background:transparent;border:0;color:#697d89;font-size:25px;padding:2px 7px}.modal-footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:9px;margin-top:18px}.toast{position:fixed;bottom:25px;right:24px;background:#173a39;color:white;padding:13px 19px;border-radius:10px;box-shadow:0 10px 30px #162d2a44;z-index:55;font-weight:700;max-width:420px}.video-box{position:relative;background:#0f2530;border-radius:10px;overflow:hidden;min-height:190px}.video-box video{width:100%;max-height:300px;display:block}.video-box:after{content:"";position:absolute;inset:20% 10%;border:2px solid #5ae1c1;border-radius:10px;pointer-events:none}.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button{padding:8px 12px;border-radius:9px;border:1px solid #dce5e7;background:white;color:#667b85;font-weight:700}.seg button.on{background:var(--accent-lt);color:var(--accent);border-color:#8ad4bf}.mobile-menu{display:none}.help-text{font-size:12px;color:var(--muted);margin-top:5px}.safe{display:flex;gap:10px;align-items:center;background:#e2f6ef;color:#157b65;padding:11px 12px;border-radius:9px;font-weight:700;font-size:12px}.dim{opacity:.82}.spacer{height:7px}@media(max-width:1120px){.grid4{grid-template-columns:repeat(2,1fr)}.supplier-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:23px}}@media(max-width:760px){.app{display:block}.side{position:fixed;z-index:20;left:-260px;width:245px;top:0;transition:left .22s;box-shadow:10px 0 32px #001b2940}.side.open{left:0}.top{height:68px;padding:0 17px}.mobile-menu{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:9px;background:#edf3f5;border:0;font-size:22px}.top .crumb{font-size:16px}.top-right .top-date{display:none}.wrap{padding:22px 15px 48px}.page-head{align-items:flex-start}.page-head h1{font-size:25px}.duo,.supplier-grid{grid-template-columns:1fr}.page-head{flex-wrap:wrap}.panel{padding:15px}.modal{padding:17px}.form-grid{grid-template-columns:1fr}}@media(max-width:390px){.grid4{gap:8px}.metric{padding:12px;min-height:124px}.metric .big{font-size:26px}.metric .symbol{font-size:15px;right:10px;top:10px}.top-right .avatar{display:none}}@media print{.side,.top,.page-head .actions,.btn,.toast{display:none!important}.app{display:block}.wrap{padding:0}.panel{box-shadow:none;border:0}body{background:white}}

/* KALENDARZ */
.cal-head{flex-wrap:wrap}.calendar-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 6px;text-align:center;color:#6f8692;font-size:11px;font-weight:800}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendar-day{appearance:none;background:#fff;color:var(--ink);border:1px solid #e0e9eb;border-radius:9px;min-width:0;min-height:96px;padding:7px;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:7px}.calendar-day.other{background:#f7f9f9;opacity:.52}.calendar-day.today{box-shadow:inset 0 0 0 2px #f0a62d}.calendar-day.selected{border:2px solid var(--accent);background:#effbf7}.calendar-day:hover{border-color:#1aa58d;background:#f5fcfa}.calendar-date{font-size:13px;font-weight:850}.calendar-events{display:grid;gap:3px}.cal-dot{display:block;padding:2px 4px;background:#e7f4ef;color:#136f5f;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:750}.cal-dot.order{background:#fff0dc;color:#a76e25}.cal-dot.google{background:#e8f0ff;color:#376eac}.cal-legend{display:flex;flex-wrap:wrap;gap:15px;margin-top:15px;color:#71808c;font-size:11px}.cal-legend span{white-space:nowrap}@media(max-width:760px){.calendar-grid{gap:3px}.calendar-day{min-height:74px;padding:4px;border-radius:7px}.calendar-date{font-size:11px}.cal-dot{font-size:9px}.cal-legend{gap:9px}}

<body>
<div class="app">
<aside class="side" id="sidebar"><div class="brand"><div class="brand-mark">⚙</div><div><strong>MÓJ WARSZTAT</strong><small>lokalnie • bez logowania</small></div></div><div class="nav-title">Organizacja pracy</div><nav id="nav"></nav><div class="side-bottom"><b>Bez logowania — ten telefon</b>Dane są tylko w tej przeglądarce, nie synchronizują się z Supabase ani z innymi telefonami. Regularnie pobieraj kopię z Ustawień.</div></aside>
<div class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn" aria-label="Otwórz menu">☰</button><span class="crumb" id="breadcrumb">Przegląd warsztatu</span></div><div class="top-right"><span class="top-date" id="today"></span><span class="chip orange">LOKALNIE • bez logowania</span><div class="avatar">MW</div></div></header><main id="content" class="wrap"></main></div>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='moj-warsztat-bez-logowania-v1';const OLD_KEY='moj-warsztat-bez-logowania-v1';const ui={page:'dashboard',query:'',filter:'Wszystkie',partsQuery:'',supplier:'Wszyscy',modal:null,calMonth:null,selectedDay:null};
const navItems=[['dashboard','▦','Pulpit'],['orders','▤','Zlecenia'],['clients','♧','Klienci i pojazdy'],['calendar','▦','Kalendarz'],['sms','✉','Wiadomości SMS'],['vin','▧','Skaner VIN'],['photos','▧','Zdjęcia uszkodzeń'],['suppliers','◈','Dostawcy części'],['settings','⚙','Ustawienia']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currency=n=>Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const ds=(shift=0)=>{let d=new Date();d.setDate(d.getDate()+shift);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
ui.calMonth=ds().slice(0,7);ui.selectedDay=ds();
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pl-PL'):'—';
const uid=prefix=>prefix+'-'+(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
function defaults(){return {settings:{name:'Mój Warsztat',sender:'Mój Warsztat'},clients:[],vehicles:[],orders:[],calendarEvents:[],sms:[],purchases:[],parts:[{sku:'FIL-120',name:'Filtr oleju',supplier:'Inter Cars',price:38,stock:6},{sku:'OL-5W30',name:'Olej 5W30 • 5 l',supplier:'Inter Cars',price:145,stock:4},{sku:'KLO-401',name:'Klocki hamulcowe przód',supplier:'Auto Partner',price:198,stock:2},{sku:'TRC-218',name:'Tarcza hamulcowa',supplier:'Inter Parts',price:170,stock:0},{sku:'FIL-222',name:'Filtr kabinowy',supplier:'Auto Partner',price:48,stock:8},{sku:'AKU-70',name:'Akumulator 70 Ah',supplier:'Inter Parts',price:410,stock:1},{sku:'PMS-77',name:'Płyn hamulcowy DOT4',supplier:'Inter Cars',price:38,stock:7},{sku:'SW-108',name:'Świece zapłonowe (szt.)',supplier:'Auto Partner',price:52,stock:4}]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY))||defaults()}catch{db=defaults()}delete db.invoices;for(const [k,v]of Object.entries(defaults()))if(db[k]===undefined)db[k]=v;db.calendarEvents ||= [];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Nie udało się zapisać danych. Sprawdź pamięć przeglądarki.');return false}};
const client=id=>db.clients.find(x=>x.id===id);const vehicle=id=>db.vehicles.find(x=>x.id===id);const vehicleName=v=>v?`${v.brand} ${v.model} • ${v.registration}`:'Brak pojazdu';const orderClient=o=>client(vehicle(o.vehicleId)?.clientId);const amount=o=>Number(o?.labor||0)+Number(o?.parts||0);
const statusColor=s=>({'Oczekuje':'orange','W trakcie':'blue','Gotowe':'green','Zakończone':'gray','Anulowane':'red'}[s]||'gray');const chip=(x,color='gray')=>`<span class="chip ${color}">${esc(x)}</span>`;
const heading=(ey,t,desc,buttons='')=>`<div class="page-head"><div><div class="eyebrow">${esc(ey)}</div><h1>${esc(t)}</h1><p>${esc(desc)}</p></div><div class="actions">${buttons}</div></div>`;
const button=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
const stat=(title,value,hint,icon)=>`<div class="metric"><div class="label">${title}</div><div class="symbol">${icon}</div><div class="big">${value}</div><div class="hint">${hint}</div></div>`;
const options=(arr,val)=>arr.map(v=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(v)}</option>`).join('');
const field=(label,name,value='',type='text',extra='')=>`<label><span class="field-label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}/></label>`;
const empty=msg=>`<div class="empty">${esc(msg)}</div>`;
function toast(text){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',4200)}
function draw(){const active=navItems.find(n=>n[0]===ui.page)||navItems[0];$('#breadcrumb').textContent=active[2];$('#nav').innerHTML=navItems.map(([id,icon,name],i)=>`${i===4||i===7?'<div class="nav-title">'+(i===4?'Komunikacja i dokumentacja':'Zaopatrzenie')+'</div>':''}<button class="nav-btn ${id===ui.page?'active':''}" data-page="${id}"><span class="nav-icon">${icon}</span>${name}</button>`).join('');$('#today').textContent=new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});let views={dashboard,orders,clients,calendar,sms,vin,photos,suppliers,settings};$('#content').innerHTML=views[ui.page]();}
function dashboard(){let open=db.orders.filter(o=>['Oczekuje','W trakcie'].includes(o.status)),ready=db.orders.filter(o=>o.status==='Gotowe'),valuation=db.orders.filter(o=>o.status==='Zakończone'||o.status==='Gotowe').reduce((v,o)=>v+amount(o),0);let buckets=Array.from({length:7},(_,i)=>{let d=ds(i-6);return {n:db.orders.filter(o=>o.date===d).length,label:new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'short'})}});let max=Math.max(1,...buckets.map(x=>x.n));return `${heading('Twoje centrum zarządzania','Dzień dobry w warsztacie','Wszystko, co ważne, w jednym miejscu.',button('+ Nowe zlecenie','order-new'))}<div class="grid4">${stat('Aktywne zlecenia',open.length,'W kolejce i podczas naprawy','🔧')}${stat('Gotowe do odbioru',ready.length,'Pojazdy czekające na klienta','✓')}${stat('Klienci',db.clients.length,'W zapisanej bazie','👥')}${stat('Wartość zleceń',currency(valuation),'Gotowe i zakończone • netto','↗')}</div><div class="duo"><section class="panel"><div class="panel-head"><h2>Ostatnie zlecenia</h2>${button('Wszystkie →','orders-open','ghost small')}</div><div class="tablewrap"><table class="data-table"><thead><tr><th>Numer / pojazd</th><th>Usługa</th><th>Wartość netto</th><th>Status</th></tr></thead><tbody>${db.orders.slice().reverse().slice(0,7).map(o=>`<tr><td><span class="table-title">${esc(o.id)}</span><div class="tiny">${esc(vehicleName(vehicle(o.vehicleId)))}</div></td><td>${esc(o.issue)}</td><td>${currency(amount(o))}</td><td>${chip(o.status,statusColor(o.status))}</td></tr>`).join('')||'<tr><td colspan="4">Brak zleceń</td></tr>'}</tbody></table></div></section><div><section class="panel"><div class="panel-head"><h2>Plan na najbliższe dni</h2></div>${db.orders.filter(o=>!['Zakończone','Anulowane'].includes(o.status)).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5).map(o=>`<div class="listcard"><div><b>${esc(vehicle(o.vehicleId)?.registration||'—')}</b><p>${esc(o.issue)}</p></div><div style="text-align:right">${chip(fmt(o.deadline),o.deadline<ds()?'red':'orange')}<div class="tiny">${esc(o.status)}</div></div></div>`).join('')||empty('Brak nadchodzących odbiorów')}</section><section class="panel"><div class="panel-head"><h2>Zlecenia w 7 dniach</h2></div><div class="bars">${buckets.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(5,Math.round(115*x.n/max))}px"></div><span>${x.label}</span></div>`).join('')}</div></section></div></div><div class="panel"><div class="panel-head"><h2>Narzędzia warsztatu</h2></div><div class="steps"><div class="step"><div class="num">1</div><div><b>Kalendarz telefonu i Google</b><div class="tiny">Wizyty i odbiory, eksport .ics oraz synchronizacja na żądanie po połączeniu konta</div></div></div><div class="step"><div class="num">2</div><div><b>SMS + VIN + zdjęcia</b><div class="tiny">Gotowe formularze, otwieranie aplikacji SMS, skan kodów i dokumentacja zdjęciowa</div></div></div><div class="step"><div class="num">3</div><div><b>Hurtownie części</b><div class="tiny">Katalog demonstracyjny i zapytania CSV do dostawców</div></div></div></div></div>`}
function orders(){let rows=db.orders.filter(o=>{let q=ui.query.toLowerCase();return (ui.filter==='Wszystkie'||o.status===ui.filter) && (!q||[o.id,o.issue,vehicleName(vehicle(o.vehicleId)),orderClient(o)?.name].join(' ').toLowerCase().includes(q))}).slice().reverse();return `${heading('Zarządzanie serwisem','Zlecenia napraw','Prowadź naprawę od przyjęcia do wydania pojazdu.',button('+ Nowe zlecenie','order-new'))}<div class="panel"><div class="searchbar"><input data-live="query" value="${esc(ui.query)}" placeholder="Szukaj po numerze, pojeździe lub kliencie"/><select data-change="filter" style="max-width:190px">${options(['Wszystkie','Oczekuje','W trakcie','Gotowe','Zakończone','Anulowane'],ui.filter)}</select></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Zlecenie</th><th>Klient i pojazd</th><th>Termin odbioru</th><th>Netto</th><th>Status</th><th>Akcje</th></tr></thead><tbody>${rows.map(o=>`<tr><td><span class="table-title">${esc(o.id)}</span><div class="tiny">${esc(o.issue)}</div></td><td>${esc(vehicleName(vehicle(o.vehicleId)))}<div class="tiny">${esc(orderClient(o)?.name)}</div></td><td>${fmt(o.deadline)}</td><td>${currency(amount(o))}</td><td>${chip(o.status,statusColor(o.status))}</td><td><button class="btn ghost small" data-action="order-edit" data-id="${esc(o.id)}">Otwórz</button> <button class="btn pale small" data-action="calendar-order" data-id="${esc(o.id)}">Termin</button></td></tr>`).join('')||'<tr><td colspan="6">Brak zleceń spełniających kryteria.</td></tr>'}</tbody></table></div></div>`}
function clients(){return `${heading('Kartoteka','Klienci i pojazdy','Kontakty, tablice rejestracyjne i historia serwisowania.',button('+ Dodaj klienta','client-new')+button('+ Dodaj pojazd','vehicle-new','ghost'))}<div class="duo"><div class="panel"><div class="panel-head"><h2>Klienci</h2>${chip(db.clients.length+' zapisanych','green')}</div>${db.clients.map(c=>`<div class="listcard"><div><b>${esc(c.name)}</b><p>${esc(c.phone||'Bez telefonu')} · ${db.vehicles.filter(v=>v.clientId===c.id).length} pojazd(ów)</p></div><button class="btn ghost small" data-action="client-edit" data-id="${esc(c.id)}">Edytuj</button></div>`).join('')||empty('Brak klientów')}</div><div class="panel"><div class="panel-head"><h2>Pojazdy</h2>${chip(db.vehicles.length+' w bazie','blue')}</div>${db.vehicles.map(v=>`<div class="listcard"><div><b>${esc(v.brand+' '+v.model)}</b><p>${esc(v.registration)} · ${esc(client(v.clientId)?.name)}</p><p>VIN: ${esc(v.vin||'—')}</p></div><button class="btn ghost small" data-action="vehicle-edit" data-id="${esc(v.id)}">Edytuj</button></div>`).join('')||empty('Brak pojazdów')}</div></div>`}
function calendar(){
 const [y,m]=ui.calMonth.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),startOffset=(first.getDay()+6)%7,days=Math.ceil((startOffset+last.getDate())/7)*7;
 const items=calendarEntries(),eventsOn=d=>items.filter(ev=>ev.start.slice(0,10)===d),displayMonth=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
 const grid=Array.from({length:days},(_,i)=>{let d=new Date(y,m-1,1-startOffset+i);let day=localDate(d).slice(0,10),list=eventsOn(day);return `<button class="calendar-day ${day.slice(0,7)!==ui.calMonth?'other':''} ${day===ds()?'today':''} ${day===ui.selectedDay?'selected':''}" data-action="cal-select" data-day="${day}" aria-label="${esc(fmt(day))}, ${list.length} wydarzeń"><span class="calendar-date">${d.getDate()}</span><span class="calendar-events">${list.slice(0,3).map(ev=>`<span class="cal-dot ${ev.src}">${esc(ev.src==='order'?'↪ '+ev.title:ev.title)}</span>`).join('')}${list.length>3?`<span class="tiny">+${list.length-3} więcej</span>`:''}</span></button>`}).join('');
 const chosen=eventsOn(ui.selectedDay).sort((a,b)=>a.start.localeCompare(b.start));
 let next=db.calendarEvents.filter(ev=>ev.end>=localDate(new Date())).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,7);
 return `${heading('Planowanie pracy','Kalendarz warsztatu','Wizyty klientów, naprawy i odbiory pojazdów.',button('+ Nowy termin','cal-new')+button('📱 Do telefonu (.ics)','cal-phone','ghost'))}
 <div class="note"><b>Dostępne od razu:</b> eksport terminów (.ics) do kalendarza telefonu lub otwieranie pojedynczego terminu w Google Calendar. Aplikacja nie loguje się do Google i nie synchronizuje wydarzeń automatycznie.</div>
 <div class="panel"><div class="panel-head cal-head"><h2>📆 ${esc(displayMonth)}</h2><div class="actions">${button('←','cal-prev','ghost small')}${button('Dzisiaj','cal-today','ghost small')}${button('→','cal-next','ghost small')}</div></div>
 <div class="calendar-weekdays">${['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'].map(n=>`<span>${n}</span>`).join('')}</div><div class="calendar-grid">${grid}</div>
 <div class="cal-legend"><span>🟩 Terminy warsztatu</span><span>🟠 Odbiory ze zleceń</span></div></div>
 <div class="duo"><section class="panel"><div class="panel-head"><h2>${esc(new Date(ui.selectedDay+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}))}</h2>${button('+ Termin tego dnia','cal-day-new','small')}</div>
 ${chosen.length?chosen.map(ev=>`<div class="listcard"><div><b>${ev.allDay?'Cały dzień':esc(ev.start.slice(11,16))} · ${esc(ev.title)}</b><p>${esc(ev.src==='order'?'Termin odbioru ze zlecenia':(ev.type||'Wizyta'))} ${ev.end&&!ev.allDay?'• do '+esc(ev.end.slice(11,16)):''}</p></div><button class="btn ghost small" data-action="cal-show" data-id="${esc(ev.id)}" data-src="${esc(ev.src)}">Szczegóły</button></div>`).join(''):empty('Brak wpisów tego dnia. Kliknij „+ Termin tego dnia”.')}</section>
 <section class="panel"><div class="panel-head"><h2>Najbliższe wizyty</h2>${chip(next.length+' wpisów','green')}</div>${next.map(ev=>`<div class="listcard"><div><b>${esc(ev.title)}</b><p>${fmt(ev.start.slice(0,10))} • ${esc(ev.start.slice(11,16))}</p></div><button class="btn ghost small" data-action="cal-show" data-id="${esc(ev.id)}" data-src="local">Otwórz</button></div>`).join('')||empty('Dodaj pierwszą wizytę.')}</section></div>
 <div class="panel"><div class="panel-head"><h2>Kalendarz telefonu</h2>${chip('Bez konta','green')}</div><p class="subtle">Dodaj termin w warsztacie, a następnie pobierz plik .ics i zaimportuj go do kalendarza telefonu. Możesz też otworzyć pojedynczy termin w Google Calendar — poza aplikacją.</p><div class="actions">${button('📱 Eksportuj wszystkie terminy (.ics)','cal-phone','pale')}</div><p class="tiny">To eksport jednorazowy, nie automatyczna synchronizacja pomiędzy telefonami.</p></div>`;
}

function sms(){return `${heading('Komunikacja','Wiadomości SMS','Przygotuj wiadomość o przyjęciu lub zakończeniu naprawy.',button('+ Przygotuj SMS','sms-new'))}<div class="note"><b>Co działa:</b> aplikacja przygotowuje wiadomość i może otworzyć edytor SMS w telefonie. <b>Co nie działa:</b> automatyczna wysyłka i raport doręczenia — do nich trzeba skonfigurować bramkę SMS po stronie serwera.</div><div class="panel"><div class="panel-head"><h2>Przygotowane wiadomości</h2></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Kontakt</th><th>Wiadomość</th><th>Data</th><th>Stan</th><th></th></tr></thead><tbody>${db.sms.slice().reverse().map(s=>`<tr><td>${esc(s.phone)}</td><td style="min-width:300px;white-space:normal">${esc(s.text)}</td><td>${fmt(s.date)}</td><td>${chip('Szkic / otwórz telefon','orange')}</td><td><button class="btn pale small" data-action="sms-open" data-id="${esc(s.id)}">Otwórz SMS</button></td></tr>`).join('')||'<tr><td colspan="5">Brak przygotowanych wiadomości.</td></tr>'}</tbody></table></div></div>`}
function vin(){return `${heading('Identyfikacja','Skaner VIN','Odczytaj VIN z obsługiwanego kodu kreskowego przy użyciu aparatu.',button('📷 Uruchom aparat','vin-scan')+button('+ Dodaj pojazd','vehicle-new','ghost'))}<div class="duo"><div class="panel"><h2>Odczyt VIN</h2><p class="subtle">Skaner rozpoznaje VIN zapisany w kodzie kreskowym Code 39 lub Code 128, zależnie od obsługi przeglądarki. Nie rozpoznaje automatycznie znaków wybitych w metalu ani tekstu z tabliczki.</p><div class="form-grid"><label class="full"><span class="field-label">Wpisz lub wklej numer VIN (17 znaków)</span><input maxlength="17" id="vinManual" placeholder="NP. WVWZZZAUZHW000001" style="text-transform:uppercase"/></label></div><div class="actions" style="margin-top:12px">${button('Sprawdź VIN','vin-check')}${button('Skanuj kod z pliku','vin-file','ghost')}</div><input id="vinFile" type="file" accept="image/*" style="display:none"/><div class="note" id="vinResult">Po rozpoznaniu numer można przypisać do nowego pojazdu.</div></div><div class="panel"><h2>Instrukcja</h2><div class="steps"><div class="step"><div class="num">1</div><div>Sprawdź, czy pojazd lub dokument ma kod kreskowy zawierający VIN.</div></div><div class="step"><div class="num">2</div><div>Uruchom aparat w HTTPS lub localhost i skieruj go na kod.</div></div><div class="step"><div class="num">3</div><div>Porównaj odczyt z dokumentami pojazdu i zapisz VIN w kartotece.</div></div></div></div></div>`}
function photos(){return `${heading('Dokumentacja','Zdjęcia uszkodzeń','Zdjęcia przypięte do konkretnego zlecenia.',button('+ Dodaj zdjęcie','photo-new'))}<div class="note warn">Zdjęcia są przechowywane tylko lokalnie na tym urządzeniu (IndexedDB). Wyczyszczenie danych przeglądarki może je usunąć. Pobieraj regularnie pełną kopię wraz ze zdjęciami z Ustawień.</div><div class="panel"><div class="panel-head"><h2>Galeria uszkodzeń</h2><span class="tiny">Zdjęcia z telefonu lub komputera</span></div><div id="photosGallery">${empty('Ładowanie lokalnej galerii…')}</div></div>`}
function suppliers(){let parts=db.parts.filter(p=>((ui.supplier==='Wszyscy')||p.supplier===ui.supplier)&&[p.name,p.sku].join(' ').toLowerCase().includes(ui.partsQuery.toLowerCase()));return `${heading('Zaopatrzenie','Dostawcy części','Porównuj własny katalog i przygotowuj zapytania zakupowe.',button('↓ Eksportuj zapytania CSV','purchases-csv','ghost'))}<div class="note warn"><b>Integracje z hurtowniami są demonstracyjne.</b> W katalogu są przykładowe pozycje i ceny, a nie aktualne oferty Inter Cars, Auto Partner ani Inter Parts. Dostęp do danych na żywo i zamawiania wymaga indywidualnych uprawnień i integracji API.</div><div class="supplier-grid">${[['Inter Cars','API / CSV dostępne po aktywacji konta','https://intercars.com/pl/rozwiazania-biznesowe-inter-cars/uslugi-dla-biznesu/oprogramowanie/api-i-csv-klient-inter-cars'],['Auto Partner','Do konfiguracji indywidualne konto i dostęp hurtowni','https://autopartner.com/'],['Inter Parts','Wymagana umowa i dane integracyjne','https://interparts.pl/']].map(s=>`<div class="supplier"><div class="sup-brand">${esc(s[0])}</div>${chip('Brak połączenia','orange')}<p>${esc(s[1])}</p><a href="${s[2]}" rel="noopener noreferrer" target="_blank">Strona dostawcy ↗</a></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>Katalog demonstracyjny części</h2>${chip(db.parts.length+' przykładowych pozycji','blue')}</div><div class="searchbar"><input data-live="partsQuery" value="${esc(ui.partsQuery)}" placeholder="Nazwa lub numer katalogowy"/><select data-change="supplier" style="max-width:190px">${options(['Wszyscy','Inter Cars','Auto Partner','Inter Parts'],ui.supplier)}</select></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Produkt</th><th>Hurtownia</th><th>Cena demo netto</th><th>Stan demo</th><th>Zapytanie</th></tr></thead><tbody>${parts.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="tiny">${esc(p.sku)}</div></td><td>${esc(p.supplier)}</td><td>${currency(p.price)}</td><td>${chip(p.stock?p.stoc /* KALENDARZ — lokalne terminy i eksport ICS, bez logowania */
function localDate(d){let t=new Date(d);return [t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')+'T'+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}
function calEntriesLocal(){let local=db.calendarEvents.map(e=>({...e,src:'local',allDay:false}));let deadlines=db.orders.filter(o=>o.deadline&&o.status!=='Anulowane').map(o=>({id:o.id,orderId:o.id,title:'Odbiór · '+(vehicle(o.vehicleId)?.registration||o.id),type:'Odbiór',start:o.deadline+'T12:00',end:o.deadline+'T13:00',src:'order',allDay:true}));return [...local,...deadlines]}
function calendarEntries(){return calEntriesLocal()}
function eventById(id,src){return calendarEntries().find(e=>e.id===id&&e.src===src)}
function openCalendarEvent(id='',onDay='',orderId=''){const ev=db.calendarEvents.find(e=>e.id===id);const initial=onDay||ui.selectedDay;const defaultStart=(initial||ds())+'T09:00';const orderOptions=['<option value="">Bez powiązania</option>',...db.orders.map(o=>`<option value="${esc(o.id)}" ${o.id===(ev?.orderId||orderId)?'selected':''}>${esc(o.id+' · '+(vehicle(o.vehicleId)?.registration||''))}</option>`)].join('');modal(ev?'Edytuj termin':'Nowy termin w kalendarzu',`<form id="calendarForm" data-id="${esc(id)}"><div class="form-grid">${field('Nazwa wydarzenia','title',ev?.title||'Wizyta w warsztacie','text','required maxlength="120"')}<label><span class="field-label">Typ wydarzenia</span><select name="type">${options(['Wizyta','Naprawa','Odbiór','Inne'],ev?.type||'Wizyta')}</select></label><label><span class="field-label">Powiązane zlecenie (opcjonalne)</span><select name="orderId">${orderOptions}</select></label>${field('Początek','start',ev?.start||defaultStart,'datetime-local','required')}${field('Koniec','end',ev?.end||localDate(new Date(new Date(defaultStart).getTime()+3600000)),'datetime-local','required')}<label class="full"><span class="field-label">Notatka prywatna</span><textarea name="note" placeholder="Nie wpisuj tutaj danych, których nie chcesz wysłać do Google.">${esc(ev?.note||'')}</textarea></label></div><div class="note">Zapis tutaj tworzy lokalny termin. Przekazanie go do telefonu lub Google wykonasz oddzielnym przyciskiem.</div><div class="modal-footer">${ev?`<button type="button" class="btn danger" data-action="cal-delete" data-id="${esc(id)}">Usuń lokalny</button>`:''}<button type="button" class="btn ghost" data-action="modal-close">Anuluj</button><button type="submit" class="btn">Zapisz termin</button></div></form>`)}
function viewCalendarItem(id,src){let ev=eventById(id,src);if(!ev)return;let local=src==='local';let actions=local?`<button class="btn pale small" data-action="cal-edit" data-id="${esc(id)}">Edytuj</button>`:src==='order'?`<button class="btn pale small" data-action="order-edit" data-id="${esc(id)}">Otwórz zlecenie</button>`:'';actions+=`<button class="btn ghost small" data-action="cal-google-link" data-id="${esc(id)}" data-src="${esc(src)}">Otwórz w Google Calendar</button><button class="btn ghost small" data-action="cal-phone-one" data-id="${esc(id)}" data-src="${esc(src)}">📱 Do telefonu</button>`;modal('Termin • '+ev.title,`<div class="listcard"><div><span class="tag">Początek</span><b>${fmt(ev.start.slice(0,10))} ${ev.allDay?'cały dzień':esc(ev.start.slice(11,16))}</b></div><div><span class="tag">Koniec</span><b>${esc(ev.allDay?'—':fmt(ev.end.slice(0,10))+' '+ev.end.slice(11,16))}</b></div></div><div class="listcard"><div><span class="tag">Źródło</span><b>${esc(src==='order'?'Termin odbioru ze zlecenia':'Mój Warsztat')}</b><p>${esc(ev.type||'')}</p></div></div>${local&&ev.note?`<div class="note">${esc(ev.note)}</div>`:''}<div class="modal-footer">${actions}<button class="btn ghost small" data-action="modal-close">Zamknij</button></div>`) }
function eventDates(ev){let start=new Date(ev.start),end=new Date(ev.end);if(ev.allDay){start=new Date(ev.start.slice(0,10)+'T00:00');end=new Date(start);end.setDate(end.getDate()+1)}if(!isFinite(start)||!isFinite(end)||end<=start)throw Error('Niepoprawny przedział czasu wydarzenia.');return {start,end}}
function toUtcICS(date){return date.toISOString().replace(/[-:]/g,'').replace(/\..*/,'Z')}
function icsEscape(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsCalendar(events){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Moj Warsztat//Calendar PL//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Mój Warsztat'];for(let ev of events){let {start,end}=eventDates(ev);lines.push('BEGIN:VEVENT','UID:'+icsEscape(ev.id)+'@moj-warsztat.local','DTSTAMP:'+toUtcICS(new Date()),ev.allDay?'DTSTART;VALUE=DATE:'+ev.start.slice(0,10).replace(/-/g,''):'DTSTART:'+toUtcICS(start),ev.allDay?'DTEND;VALUE=DATE:'+localDate(end).slice(0,10).replace(/-/g,''):'DTEND:'+toUtcICS(end),'SUMMARY:'+icsEscape(ev.title),'DESCRIPTION:'+icsEscape(ev.note||ev.type||'Termin warsztatu'),'CLASS:PRIVATE','END:VEVENT')}lines.push('END:VCALENDAR');return lines.join('\r\n')+'\r\n'}
async function shareIcs(items,name){if(!items.length){toast('Nie ma terminów do eksportu.');return}let text=icsCalendar(items),file=new File([text],name,{type:'text/calendar;charset=utf-8'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'Kalendarz warsztatu',files:[file]});return}catch(e){if(e.name==='AbortError')return}}download(name,text,'text/calendar;charset=utf-8');toast('Pobrano plik .ics. Otwórz go lub udostępnij przez aplikację kalendarza.')} 
function googleCreateUrl(ev){let {start,end}=eventDates(ev);let url=new URL('https://calendar.google.com/calendar/render');url.searchParams.set('action','TEMPLATE');url.searchParams.set('text',ev.title);url.searchParams.set('dates',toUtcICS(start)+'/'+toUtcICS(end));url.searchParams.set('details',ev.type||'Termin warsztatu');url.searchParams.set('ctz','Europe/Warsaw');return url.href}
function moveMonth(dir){let [y,m]=ui.calMonth.split('-').map(Number);let d=new Date(y,m-1+dir,1);ui.calMonth=localDate(d).slice(0,7);ui.selectedDay=ui.calMonth+'-01';draw()}

function openSms(){modal('Przygotuj SMS',`<form id="smsForm"><div class="form-grid"><label class="full"><span class="field-label">Klient</span><select name="clientId" id="smsClient" required>${db.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}</select></label><label class="full"><span class="field-label">Szablon</span><select id="smsTemplate">${options(['Pojazd gotowy do odbioru','Potwierdzenie przyjęcia','Prośba o kontakt','Własna wiadomość'],'Pojazd gotowy do odbioru')}</select></label><label class="full"><span class="field-label">Treść wiadomości</span><textarea id="smsText" name="text" required maxlength="600"></textarea><div class="tiny"><span id="smsCount">0</span> znaków. Dłuższe SMS-y mogą kosztować więcej.</div></label></div><div class="modal-footer"><button class="btn ghost" type="button" data-action="modal-close">Anuluj</button><button type="submit" class="btn">Zapisz i otwórz SMS</button></div></form>`);fillSms()}
function fillSms(){let c=client($('#smsClient')?.value);if(!c)return;let v=db.vehicles.find(v=>v.clientId===c.id);let car=v?`${v.brand} ${v.model} (${v.registration})`:'pojazd';let t=$('#smsTemplate')?.value;let text={'Pojazd gotowy do odbioru':`Dzień dobry, ${car} jest gotowy do odbioru. Pozdrawiamy, ${db.settings.sender}.`,'Potwierdzenie przyjęcia':`Dzień dobry, potwierdzamy przyjęcie pojazdu ${car} do serwisu. ${db.settings.sender}.`,'Prośba o kontakt':`Dzień dobry, prosimy o kontakt w sprawie pojazdu ${car}. ${db.settings.sender}.`,'Własna wiadomość':''}[t]??'';$('#smsText').value=text;$('#smsCount').textContent=text.length}
function openPhoto(){if(!db.orders.length){toast('Najpierw utwórz zlecenie.');return}modal('Dodaj zdjęcia uszkodzeń',`<form id="photoForm"><div class="form-grid"><label class="full"><span class="field-label">Przypisz do zlecenia</span><select name="orderId">${db.orders.map(o=>`<option value="${esc(o.id)}">${esc(o.id)} · ${esc(vehicleName(vehicle(o.vehicleId)))}</option>`).join('')}</select></label><label class="full"><span class="field-label">Wybierz zdjęcia (maks. 6)</span><input type="file" name="images" accept="image/*" capture="environment" multiple required/></label>${field('Opis uszkodzenia','note','','text','placeholder="Np. wgniecenie lewego błotnika"')}</div><div class="note">Zdjęcia zostaną zmniejszone przed zapisaniem w lokalnej pamięci urządzenia.</div><div class="modal-footer"><button type="button" class="btn ghost" data-action="modal-close">Anuluj</button><button type="submit" class="btn">Zapisz zdjęcia</button></div></form>`)}
let videoStream=null,scanInterval=null,detector=null;
function stopScan(){if(scanInterval)clearInterval(scanInterval);scanInterval=null;if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null}detector=null}
async function scan(){if(!('BarcodeDetector'in window)){toast('Przeglądarka nie obsługuje odczytu kodów. Wpisz VIN ręcznie.');return}let formats=await BarcodeDetector.getSupportedFormats().catch(()=>[]);formats=['code_39','code_128'].filter(x=>formats.includes(x));if(!formats.length){toast('Brak obsługi kodów Code 39/128 w tej przeglądarce.');return}try{detector=new BarcodeDetector({formats});videoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});modal('Skanowanie kodu VIN',`<div class="video-box"><video id="scanVideo" autoplay muted playsinline></video></div><div class="note">Przytrzymaj kod kreskowy w widocznym obszarze. Odczyt działa na HTTPS lub localhost.</div><div class="modal-footer">${button('Zatrzymaj skanowanie','modal-close','ghost')}</div>`);const v=$('#scanVideo');v.srcObject=videoStream;await v.play();let busy=false;scanInterval=setInterval(async()=>{if(busy||!detector||!v.videoWidth)return;busy=true;try{let found=await detector.detect(v);for(let b of found){let raw=(b.rawValue||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(validVIN(raw)){stopScan();close();ui.page='vin';draw();$('#vinManual').value=raw;checkVIN(raw);toast('Rozpoznano VIN z kodu kreskowego.');break}}}catch{}finally{busy=false}},650)}catch(e){stopScan();toast('Nie można uruchomić kamery: '+e.message)}}
const validVIN=x=>/^[A-HJ-NPR-Z0-9]{17}$/.test(x);
function checkVIN(val){let raw=(val||$('#vinManual')?.value||'').toUpperCase().trim();if($('#vinManual'))$('#vinManual').value=raw;let existing=db.vehicles.find(v=>v.vin===raw);let box=$('#vinResult');if(!box)return;if(!validVIN(raw)){box.className='note danger';box.innerHTML='VIN musi mieć dokładnie 17 znaków (bez I, O oraz Q). Sprawdź numer w dokumentach.';return}box.className='note';box.innerHTML=`<b>Poprawny format VIN:</b> ${esc(raw)}.${existing?' Numer istnieje w kartotece: '+esc(vehicleName(existing)):' Nie znaleziono go w kartotece.'}<br/><button class="btn pale small" data-action="vin-to-vehicle" data-vin="${esc(raw)}" style="margin-top:10px">${existing?'Otwórz pojazd':'Dodaj pojazd z VIN'}</button>`}
async function detectFile(file){if(!('BarcodeDetector'in window)){toast('Brak obsługi odczytu kodów z obrazu.');return}const supported=await BarcodeDetector.getSupportedFormats().catch(()=>[]);let fmts=['code_39','code_128'].filter(x=>supported.includes(x));if(!fmts.length){toast('Ta przeglądarka nie obsługuje odpowiednich kodów.');return}try{let bitmap=await createImageBitmap(file);let codes=await new BarcodeDetector({formats:fmts}).detect(bitmap);bitmap.close();let raw=codes.map(x=>(x.rawValue||'').trim().toUpperCase()).find(validVIN);if(!raw){toast('Nie znaleziono 17-znakowego VIN w kodzie kreskowym.');return}$('#vinManual').value=raw;checkVIN(raw)}catch(e){toast('Nie udało się odczytać obrazu: '+e.message)}}
function download(name,text,mime='application/json'){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(s){let rows=[['Hurtownia','SKU','Produkt','Ilość','Data','Status'],...s.map(p=>[p.supplier,p.sku,p.name,p.qty,p.date,'Zapytanie robocze'])];return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n')}
const openPhotoDB=()=>new Promise((ok,fail)=>{let req=indexedDB.open('moj-warsztat-bez-logowania-photos-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>ok(req.result);req.onerror=()=>fail(req.error)});
async function storePhoto(data){let pdb=await openPhotoDB();return new Promise((ok,fail)=>{const tx=pdb.transaction('photos','readwrite');tx.objectStore('photos').put(data);tx.oncomplete=()=>{pdb.close();ok()};tx.onerror=()=>{pdb.close();fail(tx.error)}})}
async function getPhotos(){let pdb=await openPhotoDB();return new Promise((ok,fail)=>{const tx=pdb.transaction('photos','readonly'),r=tx.objectStore('photos').getAll();r.onsuccess=()=>{pdb.close();ok(r.result)};r.onerror=()=>{pdb.close();fail(r.error)}})}
async function removePhoto(id){let pdb=await openPhotoDB();return new Promise((ok,fail)=>{const tx=pdb.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>{pdb.close();ok()};tx.onerror=()=>{pdb.close();fail(tx.error)}})}
async function compress(file){let bmp=await createImageBitmap(file);let rate=Math.min(1,1400/Math.max(bmp.width,bmp.height));let canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*rate);canvas.height=Math.round(bmp.height*rate);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.77));if(!blob)throw Error('Nie można przetworzyć zdjęcia');return blob}
let photoUrls=[];
async function refreshPhotos(){const box=$('#photosGallery');if(!box)return;photoUrls.forEach(u=>URL.revokeObjectURL(u));photoUrls=[];try{let photos=(await getPhotos()).sort((a,b)=>b.time-a.time);if(!$('#photosGallery'))return;box.innerHTML=photos.length?`<div class="photo-grid">${photos.map(p=>{let url=URL.createObjectURL(p.blob);photoUrls.push(url);return `<div class="photo"><img src="${url}" alt="Dokumentacja uszkodzenia"/><div class="meta"><b>${esc(p.orderId)}</b><div class="tiny">${esc(p.note||'Bez opisu')}</div><div style="margin-top:8px" class="flex-between"><span class="tiny">${fmt(p.date)}</span><button class="btn danger small" data-action="photo-delete" data-id="${esc(p.id)}">Usuń</button></div></div></div>`}).join('')}</div>`:empty('Dodaj pierwsze zdjęcie do zlecenia.')}catch(e){box.innerHTML=`<div class="note danger">Galeria niedostępna: ${esc(e.message)}</div>`}}

function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Nie można odczytać zdjęcia.'));reader.readAsDataURL(blob)})}
async function exportBackup(){try{const photos=await getPhotos();const archived=[];for(const p of photos)archived.push({...p,blob:await blobToDataUrl(p.blob)});const backup={format:'moj-warsztat-local-backup',version:1,createdAt:new Date().toISOString(),records:db,photos:archived};download('moj-warsztat-kopia-'+ds()+'.json',JSON.stringify(backup));toast('Zapisano pełną kopię. Przechowuj ją bezpiecznie.')}catch(e){toast('Nie udało się utworzyć kopii: '+e.message)}}
async function clearPhotos(){const pdb=await openPhotoDB();return new Promise((ok,fail)=>{const tx=pdb.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=()=>{pdb.close();ok()};tx.onerror=()=>{pdb.close();fail(tx.error)}})}
async function restoreBackup(file){if(!file)return;if(file.size>125*1024*1024){toast('Plik kopii przekracza limit 125 MB.');return}try{let backup=JSON.parse(await file.text());if(backup?.format!=='moj-warsztat-local-backup'||backup.version!==1||!backup.records){throw Error('To nie jest pełna kopia Mojego Warsztatu.')}let rec=backup.records;for(const key of ['clients','vehicles','orders','calendarEvents','sms','parts','purchases'])if(!Array.isArray(rec[key]))throw Error('Uszkodzona kopia: '+key);if(typeof rec.settings?.name!=='string'||!Array.isArray(backup.photos))throw Error('Niekompletna kopia danych.');if(!confirm('Przywrócić kopię? Wszystkie obecne dane i zdjęcia na tym urządzeniu zostaną zastąpione.'))return;const images=[];for(const p of backup.photos){if(typeof p.blob!=='string'||!p.blob.startsWith('data:image/'))throw Error('Nieprawidłowe zdjęcie w kopii.');const response=await fetch(p.blob);const blob=await response.blob();images.push({...p,blob})}const prev=db;db=rec;if(!save()){db=prev;throw Error('Nie udało się zapisać danych.')}await clearPhotos();for(const p of images)await storePhoto(p);draw();toast('Przywrócono kopię: '+rec.clients.length+' klientów i '+images.length+' zdjęć.')}catch(e){toast('Nie udało się przywrócić kopii: '+e.message)}}

function smsUri(s){let num=String(s.phone||'').replace(/[^+0-9]/g,'');if(!num){toast('Klient nie ma numeru telefonu.');return}let sep=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?';location.href='sms:'+num+sep+'body='+encodeURIComponent(s.text)}
function changePage(p){ui.page=p;ui.query='';ui.filter='Wszystkie';ui.partsQuery='';ui.supplier='Wszyscy';$('#sidebar').classList.remove('open');draw();if(p==='photos')refreshPhotos()}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-page],[data-action]');if(!b){if(e.target.id==='overlay')close();return}if(b.dataset.page){changePage(b.dataset.page);return}let a=b.dataset.action,id=b.dataset.id;switch(a){
 case'modal-close':close();break;case'order-new':openOrder();break;case'order-edit':close();openOrder(id);break;case'orders-open':changePage('orders');break;case'client-new':openClient();break;case'client-edit':openClient(id);break;case'vehicle-new':openVehicle();break;case'vehicle-edit':openVehicle(id);break;
 case'cal-new':openCalendarEvent();break;case'cal-day-new':openCalendarEvent('',ui.selectedDay);break;case'calendar-order':{let o=db.orders.find(o=>o.id===id);changePage('calendar');openCalendarEvent('',o?.deadline||ds(),id);break}case'cal-edit':openCalendarEvent(id);break;case'cal-select':ui.selectedDay=b.dataset.day;ui.calMonth=b.dataset.day.slice(0,7);draw();break;case'cal-prev':moveMonth(-1);break;case'cal-next':moveMonth(1);break;case'cal-today':ui.selectedDay=ds();ui.calMonth=ds().slice(0,7);draw();break;
 case'cal-show':viewCalendarItem(id,b.dataset.src);break;case'cal-delete':{let ev=db.calendarEvents.find(e=>e.id===id);if(ev&&confirm('Usunąć ten termin z aplikacji?')){db.calendarEvents=db.calendarEvents.filter(e=>e.id!==id);save();close();draw();toast('Termin usunięty lokalnie.')}break}
 case'cal-phone':await shareIcs(calEntriesLocal(),'moj-warsztat-kalendarz.ics');break;case'cal-phone-one':{let ev=eventById(id,b.dataset.src);if(ev)await shareIcs([ev],'termin-'+id.replace(/[^\w-]/g,'')+'.ics');break}case'cal-google-link':{let ev=eventById(id,b.dataset.src);if(ev)window.open(googleCreateUrl(ev),'_blank','noopener,noreferrer');break}

 case'sms-new':openSms();break;case'sms-open':{let s=db.sms.find(x=>x.id===id);if(s)smsUri(s);break}case'vin-scan':scan();break;case'vin-check':checkVIN();break;case'vin-file':$('#vinFile')?.click();break;case'vin-to-vehicle':{let v=db.vehicles.find(v=>v.vin===b.dataset.vin);openVehicle(v?.id,b.dataset.vin);break}case'photo-new':openPhoto();break;case'photo-delete':if(confirm('Usunąć to zdjęcie z pamięci urządzenia?')){await removePhoto(id);refreshPhotos();toast('Zdjęcie usunięte.')}break;case'purchase-add':{let p=db.parts.find(x=>x.sku===id);if(p){let old=db.purchases.find(x=>x.sku===id);if(old)old.qty++;else db.purchases.push({id:uid('Q'),sku:p.sku,name:p.name,supplier:p.supplier,qty:1,date:ds()});save();draw();toast('Dodano pozycję do zapytania.')}break}case'purchase-remove':db.purchases=db.purchases.filter(x=>x.id!==id);save();draw();break;case'purchases-csv':if(!db.purchases.length){toast('Dodaj najpierw część do zapytania.');break}download('zapytania_do_hurtowni.csv',csv(db.purchases),'text/csv;charset=utf-8');break;case'backup-download':await exportBackup();break;case'backup-import':$('#backupFile')?.click();break;case'reset-data':if(confirm('Usunąć wszystkie dane i zdjęcia z tego urządzenia? Tej operacji nie można cofnąć.')){db=defaults();save();await clearPhotos();draw();toast('Wyczyszczono lokalne dane.')}break;
 }

document.addEventListener('input',e=>{if(e.target.matches('[data-live]')){let key=e.target.dataset.live;ui[key]=e.target.value;const p=e.target.selectionStart;draw();let next=$(`[data-live="${key}"]`);if(next){next.focus();try{next.setSelectionRange(p,p)}catch{}}}if(e.target.id==='smsText')$('#smsCount').textContent=e.target.value.length});
document.addEventListener('change',e=>{if(e.target.matches('[data-change]')){ui[e.target.dataset.change]=e.target.value;draw()}if(e.target.id==='vinFile'&&e.target.files[0])detectFile(e.target.files[0]);if(e.target.id==='backupFile'&&e.target.files[0])restoreBackup(e.target.files[0]);if(['smsClient','smsTemplate'].includes(e.target.id))fillSms()});
document.addEventListener('submit',async e=>{let f=e.target;if(!['clientForm','vehicleForm','orderForm','calendarForm','smsForm','photoForm','settingsForm'].includes(f.id))return;e.preventDefault();let data=Object.fromEntries(new FormData(f).entries());try{if(f.id==='clientForm'){let c=client(f.dataset.id);let value={id:c?.id||uid('C'),name:data.name.trim(),phone:data.phone.trim(),email:data.email.trim(),nip:c?.nip||''};if(c)Object.assign(c,value);else db.clients.push(value);save();close();draw();toast('Zapisano klienta.')}if(f.id==='vehicleForm'){let vin=(data.vin||'').toUpperCase().replace(/\s/g,'');if(vin&&!validVIN(vin)){toast('VIN powinien mieć dokładnie 17 dozwolonych znaków.');return}if(vin&&db.vehicles.some(x=>x.vin===vin&&x.id!==f.dataset.id)){toast('Ten VIN jest już w kartotece.');return}let v=vehicle(f.dataset.id);let value={id:v?.id||uid('V'),clientId:data.clientId,brand:data.brand.trim(),model:data.model.trim(),registration:data.registration.trim().toUpperCase(),year:Number(data.year)||null,vin,mileage:Number(data.mileage)||0};if(v)Object.assign(v,value);else db.vehicles.push(value);save();close();draw();toast('Zapisano pojazd.')}if(f.id==='orderForm'){let o=db.orders.find(x=>x.id===f.dataset.id);let newNr='ZL-'+(1001+db.orders.length);while(db.orders.some(x=>x.id===newNr))newNr='ZL-'+(1001+db.orders.length+Math.floor(Math.random()*999));let val={id:o?.id||newNr,vehicleId:data.vehicleId,issue:data.issue.trim(),status:data.status,date:data.date,deadline:data.deadline,labor:Number(data.labor),parts:Number(data.parts),notes:data.notes.trim()};if(o)Object.assign(o,val);else db.orders.push(val);save();close();draw();toast('Zapisano zlecenie.')}if(f.id==='calendarForm'){let start=new Date(data.start),end=new Date(data.end);if(!Number.isFinite(+start)||!Number.isFinite(+end)||end<=start){toast('Koniec terminu musi być późniejszy niż początek.');return}let ev=db.calendarEvents.find(x=>x.id===f.dataset.id);let title=(data.title||'').trim();if(!title){toast('Wpisz tytuł terminu.');return}let value={id:ev?.id||uid('T'),title,title,type:data.type||'Wizyta',orderId:data.orderId||'',start:data.start,end:data.end,note:(data.note||'').trim(),};if(ev)Object.assign(ev,value);else db.calendarEvents.push(value);save();close();ui.selectedDay=data.start.slice(0,10);ui.calMonth=ui.selectedDay.slice(0,7);changePage('calendar');toast('Termin zapisany lokalnie. Możesz go wyeksportować do telefonu.')}if(f.id==='smsForm'){let c=client(data.clientId);if(!c?.phone){toast('Wybrany klient nie ma numeru telefonu.');return}let s={id:uid('S'),phone:c.phone,clientId:c.id,text:data.text.trim(),date:ds()};db.sms.push(s);save();close();changePage('sms');smsUri(s)}if(f.id==='photoForm'){let files=Array.from(f.querySelector('[name=images]').files).slice(0,6);if(!files.length){toast('Wybierz zdjęcie.');return}for(let img of files){if(!img.type.startsWith('image/'))continue;let blob=await compress(img);await storePhoto({id:uid('P'),orderId:data.orderId,note:data.note.trim(),date:ds(),time:Date.now()+Math.random(),blob})}close();changePage('photos');toast('Zdjęcia zapisane lokalnie w galerii.')}if(f.id==='settingsForm'){db.settings={name:data.name.trim(),sender:data.sender.trim()};save();toast('Zapisano ustawienia.')}}catch(err){toast('Wystąpił błąd: '+err.message)}});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.includes('/moj-warsztat/')).forEach(r=>r.unregister())).catch(()=>{});
draw();
})();
</script>
</body>
</html>
